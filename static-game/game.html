:root {
  --top: 84px;
  --bottom: 40px;
  --host: rgb(80, 142, 67);
  --text: #3b2a1a;
  --muted: #8b7558;
  /* 阵营：橙（我/擂主）、蓝（挑战者）、紫（人机） */
  --or-1: #ffc061; --or-2: #ff7d1f; --or-d: #b8510b;
  --bl-1: #6cc2ff; --bl-2: #2f74e6; --bl-d: #1b4aa3;
  --pu-1: #c39bff; --pu-2: #7b54e6; --pu-d: #4e30a3;
  --gd-1: #fff1a6; --gd-2: #ffbd1f; --gd-d: #a86b00;
  --gr-1: #9ff06a; --gr-2: #3fb52c; --gr-d: #237a18;
  --wood-1: #c98a4b; --wood-2: #8f5526; --wood-d: #5a3215;
  --card-1: #fffdf6; --card-2: #fff1d2; --card-bd: #e7c98f;
  --display: "JJGDisplay", "PingFang SC", "Microsoft YaHei", sans-serif;
  --soft: 0 6px 14px rgba(60, 40, 10, .18);
  font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--host);
  color: var(--text);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
svg { display: block; }

/* 描边字：描边取所在底色的深色，配下沉投影 */
.fx {
  font-family: var(--display);
  font-weight: 400;
  color: #fff;
  -webkit-text-stroke: 4px var(--st, #6a3a10);
  paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--st, #6a3a10);
}

#stage { position: fixed; inset: 0; z-index: 0; }
#stage canvas { display: block; }

.host-bar { position: fixed; left: 0; right: 0; z-index: 40; pointer-events: none; background: var(--host); }
.host-top { top: 0; height: var(--top); box-shadow: 0 4px 10px rgba(0, 0, 0, .25); }
.host-bottom { bottom: 0; height: var(--bottom); }

.app {
  position: fixed;
  top: var(--top);
  bottom: var(--bottom);
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  pointer-events: none;
}
.app > * { pointer-events: auto; }

/* ---------- 场景底图 ---------- */
.scene { position: relative; background: var(--backdrop) center bottom / cover no-repeat, #dff6ea; overflow: hidden; }
.scene > * { position: relative; z-index: 1; }

/* ---------- 通用：卡片 / 按钮 / 头像 ---------- */
.card {
  border-radius: 18px;
  background: linear-gradient(180deg, var(--card-1), var(--card-2));
  border: 2px solid var(--card-bd);
  box-shadow: inset 0 2px 0 #fff, var(--soft);
}
.btn {
  position: relative;
  flex: 1;
  height: 58px;
  border-radius: 18px;
  border: 2px solid var(--gr-d);
  background: linear-gradient(180deg, var(--gr-1), var(--gr-2));
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .16), 0 4px 0 var(--gr-d), 0 8px 14px rgba(20, 60, 10, .3);
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 2px;
  color: #fff;
  -webkit-text-stroke: 3px var(--gr-d);
  paint-order: stroke fill;
  text-shadow: 0 2px 0 var(--gr-d);
  overflow: hidden;
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn::before {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  top: 4px;
  height: 38%;
  border-radius: 12px 12px 30px 30px / 12px 12px 14px 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .08));
  pointer-events: none;
}
.btn:not(:disabled):active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .16), 0 1px 0 var(--gr-d), 0 3px 6px rgba(20, 60, 10, .3); }
.btn:disabled {
  border-color: #b9a988;
  background: linear-gradient(180deg, #f1e8d4, #d9ccb0);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .08), 0 4px 0 #b9a988;
  color: #9a8b6c;
  -webkit-text-stroke: 0;
  text-shadow: none;
  font-size: 19px;
}
.btn.yellow { border-color: var(--or-d); background: linear-gradient(180deg, var(--or-1), var(--or-2)); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .16), 0 4px 0 var(--or-d), 0 8px 14px rgba(120, 50, 0, .3); -webkit-text-stroke-color: var(--or-d); text-shadow: 0 2px 0 var(--or-d); }
.btn.small {
  flex: none;
  width: 86px;
  border-color: var(--wood-d);
  background: linear-gradient(180deg, var(--wood-1), var(--wood-2));
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2), 0 4px 0 var(--wood-d), 0 8px 14px rgba(60, 30, 0, .3);
  font-size: 19px;
  letter-spacing: 0;
  -webkit-text-stroke-color: var(--wood-d);
  text-shadow: 0 2px 0 var(--wood-d);
}

.ava {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: radial-gradient(circle at 35% 30%, #fff3df, #f6cf9f);
  box-shadow: 0 0 0 3px var(--ring, var(--gd-2)), 0 4px 8px rgba(0, 0, 0, .25);
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: var(--display);
  font-size: 24px;
  color: #8a4f17;
  flex: none;
}
.ava img { width: 100%; height: 100%; object-fit: cover; }
.ava svg { width: 40px; height: 40px; }
.ava.empty {
  background: rgba(255, 255, 255, .35);
  border: 3px dashed rgba(255, 255, 255, .9);
  box-shadow: none;
  color: #fff;
  font-family: system-ui, sans-serif;
  font-size: 30px;
  animation: breathe 1.6s ease-in-out infinite;
}
@keyframes breathe { 50% { transform: scale(1.06); } }

/* ---------- 加载 ---------- */
.splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
.loading-bar {
  width: 220px;
  height: 18px;
  padding: 3px;
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(180deg, #6b3f17, #8f5526);
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, .4), 0 2px 0 #fff8;
}
.loading-bar i {
  display: block;
  height: 100%;
  width: 42%;
  border-radius: 6px;
  background: linear-gradient(180deg, var(--gr-1), var(--gr-2));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5);
  /* 单向滑过，不再左右伸缩来回晃 */
  animation: load 1.1s ease-in-out infinite;
}
@keyframes load {
  0% { transform: translateX(-105%); }
  100% { transform: translateX(245%); }
}
.bubble {
  max-width: 300px;
  padding: 10px 16px;
  border-radius: 16px;
  background: rgba(40, 26, 10, .72);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.55;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
}
.bubble b { color: #ffd34d; }
.splash.scene { margin: calc(-1 * var(--top)) 0 calc(-1 * var(--bottom)); padding: calc(var(--top) + 24px) 24px calc(var(--bottom) + 24px); }
.splash .status { font-size: 13px; font-weight: 700; color: #4f6b55; }

/* ---------- 木牌标题 ---------- */
.logo {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 18px 10px;
  border-radius: 14px;
  border: 2px solid var(--wood-d);
  background:
    repeating-linear-gradient(176deg, rgba(255, 255, 255, .07) 0 3px, transparent 3px 9px),
    linear-gradient(180deg, var(--wood-1), var(--wood-2));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -4px 0 rgba(0, 0, 0, .2), 0 6px 12px rgba(60, 30, 0, .35);
}
.logo::before, .logo::after {
  content: "";
  position: absolute;
  top: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffe7a3, #a8701a);
}
.logo::before { left: 7px; }
.logo::after { right: 7px; }
.logo-main {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 34px;
  line-height: 1;
  letter-spacing: 3px;
  background: linear-gradient(180deg, #fffbe0 10%, #ffd34d 55%, #ff9f1a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0;
  filter: drop-shadow(0 2px 0 #5a3215) drop-shadow(0 0 1px #5a3215);
}
.logo-main span { color: transparent; }
.logo-sub { order: -1; margin-bottom: 3px; font-size: 10px; letter-spacing: 4px; font-weight: 800; color: #ffe7b8; }
.splash .logo-main { font-size: 52px; }

/* ---------- 擂台（大厅） ---------- */
.lobby { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lobby-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.logo-row { display: flex; align-items: center; justify-content: space-between; }
.round-btn {
  height: 34px;
  padding: 0 14px;
  border-radius: 17px;
  border: 2px solid var(--wood-d);
  background: linear-gradient(180deg, #fff6df, #f3d9a6);
  box-shadow: inset 0 2px 0 #fff, 0 3px 0 var(--wood-d);
  font-size: 13px;
  font-weight: 800;
  color: #6b3f17;
}
.round-btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 #fff, 0 1px 0 var(--wood-d); }

/* 对阵卡 */
.arena { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.plate {
  --c1: var(--or-1); --c2: var(--or-2); --cd: var(--or-d);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 6px 12px;
  border-radius: 20px;
  border: 2px solid var(--cd);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, .45), transparent 60%),
    linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -5px 0 rgba(0, 0, 0, .14), 0 5px 0 var(--cd), 0 10px 16px rgba(0, 0, 0, .22);
  color: #fff;
  min-height: 130px;
  overflow: hidden;
}
.plate::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .08) 0 6px, transparent 6px 14px);
  pointer-events: none;
}
.plate > * { position: relative; z-index: 1; }
.plate.blue { --c1: var(--bl-1); --c2: var(--bl-2); --cd: var(--bl-d); }
.plate.bot { --c1: var(--pu-1); --c2: var(--pu-2); --cd: var(--pu-d); }
.plate.empty {
  --cd: #8fbfa3;
  background: rgba(255, 255, 255, .35);
  border: 2px dashed rgba(255, 255, 255, .9);
  box-shadow: none;
  color: #fff;
}
.plate.empty::after { display: none; }
.plate.empty:not(:disabled):active { background: rgba(255, 255, 255, .55); }
.plate.me { box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -5px 0 rgba(0, 0, 0, .14), 0 5px 0 var(--cd), 0 0 0 4px #fff3b0, 0 10px 18px rgba(0, 0, 0, .25); }
.plate .ava { --ring: var(--cd); }
.plate-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--display);
  font-size: 18px;
  color: #fff;
  -webkit-text-stroke: 3px var(--cd);
  paint-order: stroke fill;
  text-shadow: 0 2px 0 var(--cd);
}
.plate.empty .plate-name { -webkit-text-stroke-color: #5b9478; text-shadow: 0 2px 0 #5b9478; }
.plate-role {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 10px;
  background: rgba(0, 0, 0, .22);
  font-size: 11px;
  font-weight: 800;
  color: #fff;
}
.plate-role.host { background: linear-gradient(180deg, var(--gd-1), var(--gd-2)); color: #6b3f00; box-shadow: 0 2px 0 var(--gd-d); }
.crown-ico { width: 16px; height: 11px; }
.vs-mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.vs-mark .bolt { display: none; }
.vs-mark::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #6b4a2a, #2c1c0e);
  border: 3px solid #ffd34d;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
}
.vs-mark b {
  position: relative;
  font-family: var(--display);
  font-weight: 400;
  font-size: 22px;
  font-style: italic;
  color: #ffd34d;
  text-shadow: 0 2px 0 #6b3500;
}

.panel {
  position: relative;
  padding: 6px 6px 4px;
  /* 设计师的木牌面板：九宫格，四角 30px（@3x）不拉伸 */
  border: 12px solid transparent;
  border-image: url("art/ui/panel.webp") 30 fill / 12px stretch;
  filter: drop-shadow(0 5px 8px rgba(60, 40, 10, .22));
}
.panel-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  font-family: var(--display);
  font-size: 18px;
  color: #6b3f17;
}
.panel-tab::before { content: ""; width: 6px; height: 16px; border-radius: 3px; background: linear-gradient(180deg, var(--or-1), var(--or-2)); }
.panel-lock {
  float: right;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(107, 63, 23, .12);
  font-size: 11px;
  font-weight: 800;
  color: #8b6a3e;
}
.panel-lock svg { width: 10px; height: 10px; opacity: .6; }

.targets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px 6px;
  border-radius: 14px;
  border: 2px solid #ecd6a8;
  background: linear-gradient(180deg, #fff, #fbefd4);
  box-shadow: inset 0 -3px 0 rgba(150, 100, 30, .1), 0 2px 0 #ecd6a8;
  font-family: var(--display);
  font-size: 15px;
  color: #6b3f17;
  transition: transform .1s ease;
}
.tile svg { width: 100%; max-width: 52px; height: 52px; }
.tile.on {
  border-color: var(--or-d);
  background: radial-gradient(90% 60% at 50% 0%, rgba(255, 255, 255, .55), transparent 60%), linear-gradient(180deg, var(--or-1), var(--or-2));
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14), 0 3px 0 var(--or-d), 0 6px 10px rgba(180, 80, 0, .3);
  color: #fff;
  -webkit-text-stroke: 3px var(--or-d);
  paint-order: stroke fill;
  transform: translateY(-2px);
}
.tile.on::after {
  content: "✓";
  position: absolute;
  top: -8px;
  right: -6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: linear-gradient(180deg, var(--gr-1), var(--gr-2));
  color: #fff;
  -webkit-text-stroke: 0;
  font: 900 13px/18px system-ui, sans-serif;
  text-align: center;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
}
.tile:not(:disabled):active { transform: translateY(1px); }
.locked .tile:not(.on) { opacity: .55; }

/* 难度 */
.difficulty-box { padding: 2px 2px 0; }
.diff-head { display: flex; align-items: center; justify-content: space-between; }
.diff-name { font-size: 26px; line-height: 1; }
.diff-name.t0 { --st: #2c7d1d; color: #b8f58c; }
.diff-name.t1 { --st: #a86b00; color: #ffe27a; }
.diff-name.t2 { --st: #b8510b; color: #ffb35c; }
.diff-name.t3 { --st: #9b1d1d; color: #ff8a7a; }
.diff-value {
  min-width: 46px;
  padding: 2px 12px;
  border-radius: 14px;
  background: linear-gradient(180deg, #8f5526, #6b3f17);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25);
  text-align: center;
  font-family: var(--display);
  font-size: 20px;
  color: #fff6c9;
}
.slider { position: relative; height: 50px; margin: 2px 18px 0; touch-action: none; }
.slider-track {
  position: absolute;
  left: -6px;
  right: -6px;
  top: 50%;
  height: 16px;
  margin-top: -8px;
  border-radius: 9px;
  padding: 0;
  background: linear-gradient(90deg, #8fe063, #ffd34d 45%, #ff9d3a 70%, #ff5a4a);
  box-shadow: inset 0 3px 4px rgba(0, 0, 0, .25), 0 1px 0 #fff;
  overflow: hidden;
}
.slider-cover { position: absolute; right: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #d9c7a0, #ead9b4); box-shadow: inset 0 3px 4px rgba(0, 0, 0, .2); }
.slider-thumb { position: absolute; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; transition: transform .1s ease; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .3)); }
.slider-thumb .face { width: 44px; height: 44px; }
.slider.dragging .slider-thumb { transform: scale(1.12); }
.slider.disabled { opacity: .7; }
.diff-ticks { display: flex; justify-content: space-between; margin: 0 2px; font-size: 11px; font-weight: 700; color: #c2a978; }
.diff-ticks span.on { color: #6b3f17; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 2px 5px;
  border-radius: 12px;
  background: linear-gradient(180deg, #fff, #f6e6c2);
  border: 1.5px solid #ecd6a8;
  font-size: 10px;
  color: var(--muted);
}
.stat svg { width: 18px; height: 18px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 17px; color: #6b3f17; line-height: 1.15; }

.cta-bar { padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.cta-row { display: flex; gap: 10px; }
.cta-note { min-height: 16px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.cta-note.warn { color: #c0392b; }

/* 弹字 */
.popups { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute;
  font-family: var(--display);
  font-size: 28px;
  font-style: italic;
  color: #b8f58c;
  -webkit-text-stroke: 4px #1f6b12;
  paint-order: stroke fill;
  text-shadow: 0 3px 0 #1f6b12;
  white-space: nowrap;
  animation: floatUp .8s ease-out forwards;
}
.pop.bonk { color: #fff; font-size: 32px; -webkit-text-stroke-color: #b3261e; text-shadow: 0 3px 0 #b3261e; }
@keyframes floatUp {
  0% { transform: translate(-50%, 0) rotate(-10deg) scale(.5); opacity: 0; }
  20% { transform: translate(-50%, -8px) rotate(-10deg) scale(1.1); opacity: 1; }
  100% { transform: translate(-50%, -56px) rotate(-10deg) scale(1); opacity: 0; }
}

/* 倒计时 */
.countdown { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: none; }
.rays { display: none; }
.count-num {
  font-size: 120px;
  line-height: 1;
  color: #fff6c9;
  -webkit-text-stroke: 7px #8a4a00;
  paint-order: stroke fill;
  text-shadow: 0 6px 0 #8a4a00, 0 12px 18px rgba(0, 0, 0, .3);
  animation: pop .32s ease-out;
}
.count-num.word { font-size: 64px; }
@keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 对阵开场：两枚头像徽章相向冲撞 */
.vs-intro {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 10px;
  pointer-events: none;
  background: radial-gradient(70% 45% at 50% 50%, rgba(255, 220, 120, .45), rgba(30, 18, 6, .65) 70%);
  animation: fade .2s ease-out;
}
.vs-side { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: inL .4s cubic-bezier(.2, 1.3, .5, 1) both; }
.vs-side.right { animation-name: inR; }
.vs-side .ava { width: 92px; height: 92px; font-size: 38px; border-width: 4px; }
.vs-side .ava svg { width: 64px; height: 64px; }
.vs-side.left .ava { --ring: var(--or-2); box-shadow: 0 0 0 5px var(--or-2), 0 0 26px 6px rgba(255, 140, 30, .7); }
.vs-side.right .ava { --ring: var(--bl-2); box-shadow: 0 0 0 5px var(--bl-2), 0 0 26px 6px rgba(60, 140, 255, .7); }
.vs-side.right.bot .ava { box-shadow: 0 0 0 5px var(--pu-2), 0 0 26px 6px rgba(140, 90, 255, .7); }
.vs-name { max-width: 130px; padding: 4px 14px; border-radius: 14px; font-family: var(--display); font-size: 18px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs-side.left .vs-name { background: linear-gradient(180deg, var(--or-1), var(--or-2)); box-shadow: 0 3px 0 var(--or-d); }
.vs-side.right .vs-name { background: linear-gradient(180deg, var(--bl-1), var(--bl-2)); box-shadow: 0 3px 0 var(--bl-d); }
.vs-side.right.bot .vs-name { background: linear-gradient(180deg, var(--pu-1), var(--pu-2)); box-shadow: 0 3px 0 var(--pu-d); }
.vs-big {
  font-size: 64px;
  font-style: italic;
  line-height: 1;
  background: linear-gradient(180deg, #fffbe0 15%, #ffc21a 55%, #ff7a00);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 0;
  text-shadow: none;
  filter: drop-shadow(0 3px 0 #6b3500) drop-shadow(0 0 10px rgba(255, 200, 60, .8));
  animation: pop .35s .25s ease-out both;
}
@keyframes inL { from { transform: translateX(-140%) rotate(-20deg); } to { transform: none; } }
@keyframes inR { from { transform: translateX(140%) rotate(20deg); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* 点击区 */
.tapzone { position: fixed; top: var(--top); bottom: var(--bottom); left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: 1fr 1fr; touch-action: none; }
.tapzone[hidden] { display: none; }
.tap-half { width: 100%; height: 100%; touch-action: none; }

/* ---------- 浮层 ---------- */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: radial-gradient(70% 50% at 50% 45%, rgba(255, 220, 140, .25), rgba(30, 18, 6, .7));
  animation: fade .2s ease-out;
}
.result {
  position: relative;
  width: 100%;
  max-width: 340px;
  padding: 40px 14px 14px;
  border-radius: 24px;
  border: 3px solid var(--wood-d);
  background: linear-gradient(180deg, var(--card-1), var(--card-2));
  box-shadow: inset 0 0 0 4px #f3dcae, inset 0 3px 0 6px #fff, 0 12px 26px rgba(0, 0, 0, .4);
  animation: rise .3s cubic-bezier(.2, 1.3, .5, 1);
}
@keyframes rise { from { transform: translateY(24px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.ribbon {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  min-width: 210px;
  padding: 8px 30px 10px;
  text-align: center;
  background: radial-gradient(100% 70% at 50% 0%, rgba(255, 255, 255, .45), transparent 60%), linear-gradient(180deg, var(--or-1), var(--or-2));
  border: 2px solid var(--or-d);
  border-radius: 14px;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 4px 0 var(--or-d), 0 8px 14px rgba(0, 0, 0, .3);
}
.ribbon.lose { background: linear-gradient(180deg, #c9c6d6, #8d89a3); border-color: #5e5a73; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 4px 0 #5e5a73; }
.ribbon.draw { background: linear-gradient(180deg, var(--bl-1), var(--bl-2)); border-color: var(--bl-d); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 4px 0 var(--bl-d); }
.ribbon .fx { font-size: 32px; letter-spacing: 6px; --st: var(--or-d); }
.ribbon.lose .fx { --st: #5e5a73; }
.ribbon.draw .fx { --st: var(--bl-d); }
.stars { display: flex; justify-content: center; gap: 6px; margin: 0 0 4px; }
.stars svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25)); }
.stars svg:nth-child(2) { transform: translateY(-6px) scale(1.2); }
.result-sub { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.result-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 16px; }
.rcol {
  --c1: var(--or-1); --c2: var(--or-2); --cd: var(--or-d);
  position: relative;
  padding: 14px 6px 10px;
  border-radius: 18px;
  border: 2px solid var(--cd);
  background: radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, .4), transparent 60%), linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14), 0 3px 0 var(--cd);
  text-align: center;
  color: #fff;
}
.rcol.blue { --c1: var(--bl-1); --c2: var(--bl-2); --cd: var(--bl-d); }
.rcol.bot { --c1: var(--pu-1); --c2: var(--pu-2); --cd: var(--pu-d); }
.rcol.winner { box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14), 0 3px 0 var(--cd), 0 0 0 4px #fff3b0, 0 0 18px rgba(255, 200, 60, .8); }
.rcol .crown-ico { position: absolute; top: -18px; left: 50%; width: 36px; height: 25px; margin-left: -18px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .3)); }
.rcol .ava { width: 46px; height: 46px; margin: 0 auto 2px; font-size: 20px; --ring: var(--cd); }
.rcol .ava svg { width: 34px; height: 34px; }
.rname { font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rscore { font-size: 40px; line-height: 1.1; --st: var(--cd); color: #fff6c9; }
.rscore small { font-size: 14px; color: #fff; margin-left: 2px; }
.rmeta { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-top: 4px; }
.rmeta span { padding: 2px 0; border-radius: 8px; background: rgba(0, 0, 0, .18); font-size: 9px; color: rgba(255, 255, 255, .9); }
.rmeta b { display: block; font-family: var(--display); font-weight: 400; font-size: 14px; color: #fff; line-height: 1.15; }

/* ---------- 新手引导 ---------- */
.guide-layer { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; pointer-events: none; }
.guide-bubble {
  position: relative;
  margin: 12px 14px 0;
  padding: 10px 12px 12px 64px;
  border-radius: 18px;
  background: linear-gradient(180deg, var(--card-1), var(--card-2));
  border: 2px solid var(--card-bd);
  box-shadow: inset 0 2px 0 #fff, 0 8px 18px rgba(0, 0, 0, .22);
  pointer-events: auto;
  animation: rise .3s ease-out;
}
.guide-coach {
  position: absolute;
  left: 10px;
  top: 12px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: linear-gradient(180deg, var(--or-1), var(--or-2));
  box-shadow: 0 0 0 2px var(--or-d), 0 3px 6px rgba(0, 0, 0, .25);
  display: grid;
  place-items: center;
  color: #fff;
  font-family: var(--display);
  font-size: 20px;
}
.guide-step { font-size: 11px; font-weight: 800; color: var(--muted); }
.guide-text { margin-top: 2px; font-family: var(--display); font-size: 19px; line-height: 1.3; color: #5a3215; }
.guide-text em { font-style: normal; color: #e8590c; }
.guide-sub { margin-top: 3px; font-size: 12px; color: var(--muted); }
.guide-skip { position: absolute; top: 8px; right: 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.guide-hand { position: absolute; bottom: 22%; width: 60px; height: 60px; margin-left: -18px; animation: tapHand .9s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .3)); }
.guide-hand .hand-ico { width: 60px; height: 60px; }
@keyframes tapHand { 50% { transform: translateY(8px) scale(.94); } }
.guide-done { margin-top: auto; padding: 0 16px 16px; pointer-events: auto; }
.rules { display: grid; gap: 8px; margin: 2px 0 16px; }
.rule { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .7); font-size: 13px; line-height: 1.5; }
.rule i {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-style: normal;
  font-family: var(--display);
  font-size: 15px;
  color: #fff;
  background: linear-gradient(180deg, var(--or-1), var(--or-2));
  box-shadow: 0 2px 0 var(--or-d);
}
.rule b { color: #e8590c; }

/* 状态提示 */
.notice {
  position: absolute;
  left: 50%;
  top: 10px;
  z-index: 35;
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 7px 16px;
  border-radius: 16px;
  background: rgba(40, 26, 10, .85);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  pointer-events: none;
}
.toast {
  position: absolute;
  left: 50%;
  bottom: 100px;
  z-index: 36;
  transform: translateX(-50%);
  max-width: calc(100% - 48px);
  padding: 8px 16px;
  border-radius: 16px;
  background: rgba(40, 26, 10, .85);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  pointer-events: none;
  animation: fade .2s ease-out;
}

@media (max-height: 640px) {
  .lobby-scroll { gap: 10px; }
  .plate { min-height: 108px; padding-top: 10px; }
  .ava { width: 48px; height: 48px; }
  .tile svg { height: 42px; }
  .btn { height: 50px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- 分步流程 ---------- */
.flow-head { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; }
.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid var(--wood-d);
  background: linear-gradient(180deg, #fff6df, #f3d9a6);
  box-shadow: inset 0 2px 0 #fff, 0 3px 0 var(--wood-d);
  font-size: 28px;
  line-height: 30px;
  font-weight: 700;
  color: #6b3f17;
}
.back-btn.ghost { visibility: hidden; }
.back-btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 #fff, 0 1px 0 var(--wood-d); }
.flow-title {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;

/* 选模式页：两张模式卡（以及上方的入座提示）在剩余空间里垂直居中 */

/* ---------- 对局中间的细对抗条 ---------- */
.hud.duel {

.duel-timer {
  position: absolute;

  height: 40px;
  margin: -20px 0 0 -20px;

/* ---------- 选模式页：设计稿整张图（972×1618）+ 透明点击区 ---------- */

.mbtn { position: absolute; left: 6%; width: 88%; padding: 0; background: none; border: 0; cursor: pointer; transition: transform .08s ease, filter .08s ease; -webkit-tap-highlight-color: transparent; }

/* ---------- ③ 选劈什么和难度页：设计稿原图 + 动态内容 ----------

.sm-canvas { --v: min(100cqw / 982, 100cqh / 1510); position: absolute; left: 50%; top: 0; width: calc(var(--v) * 982); height: calc(var(--v) * 1602); transform: translateX(-50%); }

.sm-lock { top: calc(var(--v) * 250); right: calc(var(--v) * 184); padding: calc(var(--v) * 5) calc(var(--v) * 16); border-radius: calc(var(--v) * 22); background: rgba(255, 250, 232, .95); box-shadow: 0 calc(var(--v) * 3) 0 rgba(120, 80, 20, .25); font-size: calc(var(--v) * 26); line-height: 1.2; font-weight: 800; color: #8a5a20; white-space: nowrap; pointer-events: none; }

.sm-canvas .slider-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #6fcf3a, #d6e83a); box-shadow: inset 0 calc(var(--v) * 4) calc(var(--v) * 4) rgba(255, 255, 255, .35); }

.sm-canvas .slider-thumb { width: calc(var(--v) * 96); height: calc(var(--v) * 96); margin: calc(var(--v) * -48) 0 0 calc(var(--v) * -48); filter: drop-shadow(0 calc(var(--v) * 5) calc(var(--v) * 5) rgba(0, 0, 0, .3)); }
