<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0f1e" />
<title>节节高</title>
<style>
/*
  手机界面（.phone）= 游戏整屏，按设计稿 750×1624 等比铺满可用区域。
  顶部 322 / 底部 80（750 设计宽度单位）是互动房上下组件的位置：这里不画任何组件，
  只用当前页面取到的颜色做渐变，从不透明平滑过渡到透明，接上下面的游戏画面。
*/
@property --tc { syntax: "<color>"; inherits: true; initial-value: rgb(80, 142, 67); }
@property --bc { syntax: "<color>"; inherits: true; initial-value: rgb(165, 140, 80); }

:root {
  --page: #0b0f1e;
  --bar-text: rgba(233, 237, 255, .72);
  --pill-bg: rgba(255, 255, 255, .08);
  --pill-on: #ffd34d;
  --pill-on-text: #3b2a1a;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--page);
}
body {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}

/* 预览视角切换（在手机外面，不占互动房的位置） */
.viewbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 8px 16px;
  color: var(--bar-text);
  font-size: 13px;
}
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--pill-bg); }
.seg button {
  font: inherit;
  font-weight: 700;
  color: var(--bar-text);
  background: none;
  border: 0;
  padding: 5px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.reset {
  font: inherit;
  font-weight: 700;
  color: var(--bar-text);
  background: var(--pill-bg);
  border: 0;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-text); }

.stage {
  min-height: 0;
  display: grid;
  place-items: center;
  container-type: size;
}
.phone {
  position: relative;
  width: min(100cqw, calc(100cqh * 750 / 1624));
  height: min(100cqh, calc(100cqw * 1624 / 750));
  overflow: hidden;
  background: var(--tc);
  container-type: inline-size;
  transition: --tc .35s ease, --bc .35s ease;
}
.phone iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}

/* 互动房上下组件的位置：只保留取色渐变 */
.room-top, .room-bottom {
  --ru: calc(100cqw / 750);
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 5;
}
.room-top {
  top: 0;
  height: calc(322 * var(--ru));
  background: linear-gradient(180deg,
    var(--tc) 0%,
    var(--tc) 30%,
    color-mix(in srgb, var(--tc) 94.4%, transparent) 40%,
    color-mix(in srgb, var(--tc) 80.2%, transparent) 50%,
    color-mix(in srgb, var(--tc) 60.6%, transparent) 60%,
    color-mix(in srgb, var(--tc) 39.4%, transparent) 70%,
    color-mix(in srgb, var(--tc) 19.8%, transparent) 80%,
    color-mix(in srgb, var(--tc) 5.6%, transparent) 90%,
    color-mix(in srgb, var(--tc) 0%, transparent) 100%);
}
.room-bottom {
  bottom: 0;
  height: calc(80 * var(--ru));
  background: linear-gradient(0deg,
    var(--bc) 0%,
    var(--bc) 30%,
    color-mix(in srgb, var(--bc) 94.4%, transparent) 40%,
    color-mix(in srgb, var(--bc) 80.2%, transparent) 50%,
    color-mix(in srgb, var(--bc) 60.6%, transparent) 60%,
    color-mix(in srgb, var(--bc) 39.4%, transparent) 70%,
    color-mix(in srgb, var(--bc) 19.8%, transparent) 80%,
    color-mix(in srgb, var(--bc) 5.6%, transparent) 90%,
    color-mix(in srgb, var(--bc) 0%, transparent) 100%);
}
/* 上下区域在加载页真正画出来之前不显示任何颜色（不再先出一块色块） */
/* 加载页由外壳直接画（图片内嵌在本页），第一帧就是它；游戏首页准备好后再淡出 */
.boot { position: absolute; inset: 0; z-index: 4; background: rgb(80, 142, 67); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7cqw; transition: opacity .3s ease; }
.boot .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; transform: none; filter: none; }
.boot .logo, .boot .bar { position: relative; }
.boot .logo { width: 66cqw; height: auto; transform: translateY(-4cqw); filter: drop-shadow(0 .8cqw 1cqw rgba(40, 25, 5, .28)); }
.boot .bar { width: 56cqw; height: 4.2cqw; padding: .7cqw; border-radius: 2.4cqw; background: linear-gradient(180deg, #6b3f17, #8f5526); box-shadow: inset 0 .5cqw .7cqw rgba(0, 0, 0, .4), 0 .5cqw 0 rgba(255, 255, 255, .5); transform: translateY(-4cqw); }
.boot .bar i { display: block; height: 100%; width: 0; border-radius: 1.6cqw; background: linear-gradient(180deg, #9ff06a, #3fb52c); box-shadow: inset 0 .5cqw 0 rgba(255, 255, 255, .5); transition: width .25s ease-out; }
.phone:not(.shown) { visibility: hidden; }
.phone.ready .boot { opacity: 0; pointer-events: none; }
</style>
</head>

<div class="viewbar" role="group" aria-label="预览视角">
  <span>预览视角</span>

    <button type="button" data-view="host" aria-pressed="true">房主</button>
    <button type="button" data-view="guest" aria-pressed="false">非房主</button>
  </span>
  <button type="button" class="reset" id="reset" title="清除「已看过新手引导」记录，下次开始游戏会重新出现">重置引导</button>
</div>

<script>
(function () {
  var ph = document.getElementById("phone"), ims = ph.querySelectorAll(".boot img"), n = 0;
  function one() { if (++n >= ims.length) ph.classList.add("shown"); }
  window.__bootImg = null;
  ims.forEach(function (im) { (im.decode ? im.decode() : Promise.resolve()).then(one, one); });
})();
var bootBar = document.getElementById("bootbar"), bootP = 0, bootT0 = Date.now();
function bootTo(p) { bootP = Math.max(bootP, p); bootBar.style.width = Math.round(bootP * 100) + "%"; }
/* 游戏脚本下载期间按时间缓慢前进（最多到 60%），之后按真实加载进度 */
(function tick() { if (bootP >= .99) return; bootTo(Math.min(.6, (Date.now() - bootT0) / 4000 * .6)); setTimeout(tick, 120); })();
(function () {
  var phone = document.getElementById("phone");
  var frame = document.getElementById("game");
  var buttons = document.querySelectorAll(".seg button");

  function getView() {
    try { var q = new URLSearchParams(location.search).get("view"); return q === "guest" || q === "challenger" ? "guest" : "host"; }
    catch (e) { return "host"; }
  }
  function load(view) {
    phone.classList.remove("ready");
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.view === view)); });
    frame.src = "game.html?v=jjg14a" + (view === "guest" ? "&view=guest" : "");
    try {
      var u = new URL(location.href);
      if (view === "guest") u.searchParams.set("view", "guest"); else u.searchParams.delete("view");
      history.replaceState(null, "", u);
    } catch (e) {}
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { load(b.dataset.view); });
  });

  // 游戏页把当前界面最上 / 最下的取色发过来，上下渐变跟着换（颜色平滑过渡）
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (d && d.type === "jjg-progress") { bootTo(d.p); return; }
    if (d && d.type === "jjg-ready") { bootTo(1); setTimeout(function () { phone.classList.add("ready"); }, 120); return; }
    if (!d || d.type !== "jjg-edge") return;
    phone.style.setProperty("--tc", "rgb(" + d.top + ")");
    phone.style.setProperty("--bc", "rgb(" + d.bottom + ")");
  });

  document.getElementById("reset").addEventListener("click", function () {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf("jiejiegao.guide") === 0) localStorage.removeItem(k);
      }
    } catch (e) {}
    load(getView());
  });

  load(getView());
})();
</script>
