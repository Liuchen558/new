<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14261c" />
<title>节节高 · 互动房</title>
<style>
  :root {
    --phone-w: 390;
    --phone-h: 844;
    --inset-top: 322;
    --inset-bottom: 80;
    --design: 750;
    --edge-top: 54, 90, 48;
    --edge-bottom: 54, 90, 48;
    --room: #101a14;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--room);
    color: #fff;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
  }

  .room {
    position: relative;
    width: min(100vw, calc(100vh * var(--phone-w) / var(--phone-h)));
    height: min(100vh, calc(100vw * var(--phone-h) / var(--phone-w)));
    max-width: 430px;
    background: #1d3a2c;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .06);
  }

  .room iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #1d3a2c;
  }

  .host {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 20;
    pointer-events: none;
  }

  .host > * { pointer-events: auto; }

  .host-top {
    top: 0;
    /* exact height set by layout() to match game --top inset */
    background: linear-gradient(
      180deg,
      rgba(12, 28, 18, .92) 0%,
      rgba(18, 42, 28, .88) 55%,
      rgba(var(--edge-top), .78) 100%
    );
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 18px rgba(0, 0, 0, .28);
    display: flex;
    flex-direction: column;
    padding: 10px 12px 12px;
    gap: 10px;
  }

  .host-bottom {
    bottom: 0;
    height: 42px;
    background: linear-gradient(
      0deg,
      rgba(12, 28, 18, .94) 0%,
      rgba(var(--edge-bottom), .82) 100%
    );
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 28px;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, .28);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .icon-btn svg { width: 14px; height: 14px; display: block; }

  .nav-title {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .nav-title strong {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nav-title span {
    font-size: 11px;
    color: rgba(255, 255, 255, .72);
  }

  .capsule {
    display: flex;
    align-items: center;
    height: 24px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .35);
    background: rgba(0, 0, 0, .18);
    overflow: hidden;
    flex: 0 0 auto;
  }

  .capsule button {
    width: 34px;
    height: 100%;
    border: 0;
    background: transparent;
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }

  .capsule button + button { border-left: 1px solid rgba(255, 255, 255, .28); }
  .capsule svg { width: 14px; height: 14px; }

  .seats {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-height: 0;
    flex: 1;
    overflow: hidden;
  }

  .seat {
    width: 54px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
  }

  .seat .ava {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255, 220, 120, .9);
    background:
      radial-gradient(circle at 35% 30%, #ffe7b0, #d9953a 55%, #8a4d12);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }

  .seat.host .ava { border-color: #ffd24a; }
  .seat.empty .ava {
    border-style: dashed;
    border-color: rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .08);
    color: rgba(255, 255, 255, .55);
    font-size: 20px;
  }

  .seat .tag {
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    padding: 1px 5px;
    border-radius: 7px;
    background: linear-gradient(180deg, #ffe58a, #f0a020);
    color: #5a3210;
    font-size: 9px;
    font-weight: 800;
    white-space: nowrap;
  }

  .seat .name {
    max-width: 54px;
    font-size: 10px;
    color: rgba(255, 255, 255, .88);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .watchers {
    margin-left: auto;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding-right: 2px;
  }

  .watchers .pile {
    display: flex;
    flex-direction: row-reverse;
  }

  .watchers .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .7);
    margin-left: -8px;
    background: linear-gradient(180deg, #9ad0ff, #3a78d8);
  }

  .watchers .dot:nth-child(2) { background: linear-gradient(180deg, #ffc39a, #e06a2f); }
  .watchers .dot:nth-child(3) { background: linear-gradient(180deg, #d2b4ff, #7a4fe0); }

  .watchers em {
    font-style: normal;
    font-size: 11px;
    color: rgba(255, 255, 255, .78);
  }

  .chat {
    flex: 1;
    min-width: 0;
    height: 30px;
    border: 0;
    border-radius: 15px;
    padding: 0 12px;
    background: rgba(255, 255, 255, .14);
    color: #fff;
    font: inherit;
    font-size: 12px;
  }

  .chat::placeholder { color: rgba(255, 255, 255, .55); }

  .tool {
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 15px;
    background: rgba(255, 255, 255, .16);
    color: #fff;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .tool.gift {
    background: linear-gradient(180deg, #ffd36a, #ff8d2a);
    color: #5a2e08;
    box-shadow: 0 2px 0 #b85a0c;
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 56px;
    transform: translateX(-50%);
    z-index: 30;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, .72);
    color: #fff;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }

  @media (max-width: 480px) and (orientation: portrait) {
    .room {
      width: 100vw;
      height: 100vh;
      max-width: none;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="room" id="room">
      <iframe id="game" src="./game.html" title="节节高" allow="autoplay; fullscreen" loading="eager"></iframe>

      <aside class="host host-top" id="hostTop" aria-label="互动房顶部">
        <div class="nav">
          <button class="icon-btn" type="button" id="btnClose" aria-label="退出房间">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg>
          </button>
          <div class="nav-title">
            <strong>节节高 · 手速擂台</strong>
            <span>互动房趣味玩法 · 房间 8821</span>
          </div>
          <div class="capsule" aria-label="更多">
            <button type="button" id="btnMore" aria-label="更多">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </button>
            <button type="button" id="btnCapsule" aria-label="菜单">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>
            </button>
          </div>
        </div>

        <div class="seats">
          <div class="seat host">
            <div class="ava">🐱<span class="tag">房主</span></div>
            <div class="name">竹林队长</div>
          </div>
          <div class="seat">
            <div class="ava">🐯</div>
            <div class="name">快刀阿虎</div>
          </div>
          <div class="seat">
            <div class="ava">🐰</div>
            <div class="name">我</div>
          </div>
          <div class="seat empty">
            <div class="ava">+</div>
            <div class="name">邀请</div>
          </div>
          <div class="watchers">
            <div class="pile" aria-hidden="true">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <em>128 人围观</em>
          </div>
        </div>
      </aside>

      <aside class="host host-bottom" id="hostBottom" aria-label="互动房底部">
        <input class="chat" type="text" placeholder="说点什么…" maxlength="40" aria-label="发送弹幕" />
        <button class="tool" type="button" id="btnEmoji">表情</button>
        <button class="tool gift" type="button" id="btnGift">送礼</button>
      </aside>

      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>

  <script>
    (() => {
      const DESIGN = 750;
      const INSET_TOP = 322;
      const INSET_BOTTOM = 80;
      const room = document.getElementById('room');
      const hostTop = document.getElementById('hostTop');
      const hostBottom = document.getElementById('hostBottom');
      const toast = document.getElementById('toast');
      let toastTimer = 0;

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
      }

      function layout() {
        const w = room.clientWidth || 390;
        const scale = w / DESIGN;
        const top = Math.round(INSET_TOP * scale);
        const bottom = Math.round(INSET_BOTTOM * scale);
        hostTop.style.height = `${top}px`;
        hostBottom.style.height = `${bottom}px`;
      }

      function parseEdge(value, fallback) {
        if (typeof value === 'string' && /^\d+,\d+,\d+$/.test(value)) return value;
        if (Array.isArray(value) && value.length === 3) return value.join(',');
        return fallback;
      }

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.type !== 'jjg-edge') return;
        const top = parseEdge(data.top, '54,90,48');
        const bottom = parseEdge(data.bottom, top);
        document.documentElement.style.setProperty('--edge-top', top);
        document.documentElement.style.setProperty('--edge-bottom', bottom);
      });

      window.addEventListener('resize', layout);
      new ResizeObserver(layout).observe(room);
      layout();

      document.getElementById('btnClose').addEventListener('click', () => {
        showToast('演示房：已模拟退出互动房');
      });
      document.getElementById('btnMore').addEventListener('click', () => {
        showToast('房间设置（演示）');
      });
      document.getElementById('btnCapsule').addEventListener('click', () => {
        showToast('更多菜单（演示）');
      });
      document.getElementById('btnEmoji').addEventListener('click', () => {
        showToast('发送了表情 🎉');
      });
      document.getElementById('btnGift').addEventListener('click', () => {
        showToast('送出竹子 ×1（演示）');
      });

      const chat = document.querySelector('.chat');
      chat.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const text = chat.value.trim();
        if (!text) return;
        showToast(`弹幕：${text}`);
        chat.value = '';
      });
    })();
  </script>
</body>
</html>
