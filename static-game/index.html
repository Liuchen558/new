<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#10281c" />
<title>节节高 · 手速擂台</title>
<style>
  :root {
    --desk: #10281c;
    --bezel: #0a1a12;
    --glow: rgba(90, 160, 90, .18);
    --phone-w: 390;
    --phone-h: 844;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 20%, rgba(46, 110, 70, .35), transparent 55%),
      radial-gradient(90% 70% at 50% 100%, rgba(20, 60, 35, .55), transparent 50%),
      var(--desk);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 16px;
  }

  .phone {
    position: relative;
    width: min(100vw - 32px, calc((100vh - 32px) * var(--phone-w) / var(--phone-h)), 430px);
    aspect-ratio: var(--phone-w) / var(--phone-h);
    max-height: calc(100vh - 32px);
    border-radius: 28px;
    background: var(--bezel);
    box-shadow:
      0 0 0 2px rgba(255, 255, 255, .06),
      0 24px 60px rgba(0, 0, 0, .45),
      0 0 80px var(--glow);
    overflow: hidden;
  }

  .phone iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #1d3a2c;
  }

  /* Real phones: fill the whole screen, no fake bezel */
  @media (max-width: 480px) and (orientation: portrait) {
    .stage { padding: 0; }
    .phone {
      width: 100vw;
      height: 100vh;
      max-height: none;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone" aria-label="手机预览">
      <iframe
        src="./game.html"
        title="节节高"
        allow="autoplay; fullscreen"
        loading="eager"
      ></iframe>
    </div>
  </div>
</body>
</html>
