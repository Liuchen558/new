<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1d3a2c" />
<title>节节高</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0f1e;
}

body {
  display: grid;
  place-items: center;
}

/* 设计稿宽高比 750:1624 —— 游戏整屏铺满 */
.phone {
  --pw: 750;
  --ph: 1624;
  position: relative;
  flex: none;
  width: min(100vw, calc(100dvh * var(--pw) / var(--ph)));
  height: min(100dvh, calc(100vw * var(--ph) / var(--pw)));
  background: #1d3a2c;
  overflow: hidden;
}

.phone iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #1d3a2c;
}

@media (max-aspect-ratio: 750/1624) and (orientation: portrait) {
  html, body { background: #1d3a2c; }
  .phone {
    width: 100vw;
    height: 100dvh;
  }
}
</style>
</head>
<body>
<div class="phone" id="phone" aria-label="节节高">
  <iframe src="game.html?v=lite1" title="节节高"></iframe>
</div>
</body>
</html>
